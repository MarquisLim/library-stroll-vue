server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 30m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/internal/ { return 404; }

    # Legacy messenger files must pass Laravel's membership check too.
    location ~* ^/storage/attachments/ {
        rewrite ^ /index.php last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 200s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(?:css|js|woff2?|ttf|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 8k;
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/internal/ai/artwork-visibility {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param AI_VISIBILITY_INTERNAL "1";
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 5s;
    }

    location / { return 404; }
}
