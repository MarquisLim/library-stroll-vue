name: ${COMPOSE_PROJECT_NAME:-library-stroll-docker}

x-php: &php
  image: library-stroll-app:local
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
    args:
      VITE_APP_NAME: ${APP_NAME:-LibraryStroll}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-docker-local-key}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-8081}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
  env_file: docker/.env
  environment: &php-env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    CACHE_STORE: redis
    CACHE_PREFIX: 'cache:'
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: 'null'
    REDIS_PREFIX: 'library_stroll_docker:'
    REDIS_DB: 0
    REDIS_CACHE_DB: 1
    REDIS_SESSION_DB: 2
    REDIS_LOCK_DB: 3
    REDIS_CACHE_LOCK_CONNECTION: locks
    REDIS_CONNECT_TIMEOUT: 3
    REDIS_READ_TIMEOUT: 10
    REDIS_QUEUE_RETRY_AFTER: 900
    REDIS_QUEUE_BLOCK_FOR: 5
    SESSION_DRIVER: redis
    SESSION_CONNECTION: sessions
    SESSION_DOMAIN: 'null'
    SESSION_SECURE_COOKIE: 'false'
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    AI_SERVICE_URL: http://ai-api:8001
    AI_SERVICE_TIMEOUT: 180
    AI_SERVICE_RETRY_TIMES: 2
    FILESYSTEM_DISK: local
    MEDIA_DISK: public
    IMAGE_DRIVER: gd
    FFMPEG_PATH: /usr/bin/ffmpeg
    FFPROBE_PATH: /usr/bin/ffprobe
    MAIL_MAILER: log
  volumes:
    - app-storage:/var/www/html/storage
  init: true
  restart: unless-stopped
  stop_grace_period: 11m

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-library_stroll}
      MYSQL_USER: ${DB_USERNAME:-library_stroll}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate docker/.env with scripts/docker.ps1 init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate docker/.env with scripts/docker.ps1 init}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5.2-apache}
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: '0'
      UPLOAD_LIMIT: 64M
    ports:
      - '127.0.0.1:${PHPMYADMIN_PORT:-8089}:80'
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, '$$request = curl_init("http://127.0.0.1/"); curl_setopt($$request, CURLOPT_RETURNTRANSFER, true); curl_setopt($$request, CURLOPT_TIMEOUT, 3); curl_exec($$request); exit(curl_getinfo($$request, CURLINFO_HTTP_CODE) === 200 ? 0 : 1);']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.0}
    ports:
      - '127.0.0.1:${QDRANT_PORT:-6335}:6333'
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  init:
    <<: *php
    command: [sh, docker/php/init.sh]
    restart: 'no'
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  app:
    <<: *php
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'php -r ''exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);''']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: library-stroll-web:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
      args:
        VITE_APP_NAME: ${APP_NAME:-LibraryStroll}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-docker-local-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      - '127.0.0.1:${APP_PORT:-8088}:80'
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/up]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker-default:
    <<: *php
    command: [php, artisan, 'queue:work', redis, '--queue=default', '--timeout=600', '--tries=3', '--sleep=1', '--max-time=3600']
    depends_on:
      init: {condition: service_completed_successfully}

  worker-ai:
    <<: *php
    command: [sh, -c, 'exec php artisan queue:work redis --queue="$${AI_PROCESSING_QUEUE:-ai}" --timeout=600 --tries=3 --sleep=1 --max-time=3600']
    depends_on:
      init: {condition: service_completed_successfully}
      ai-api: {condition: service_healthy}

  scheduler:
    <<: *php
    command: [php, artisan, 'schedule:work']
    depends_on:
      init: {condition: service_completed_successfully}

  reverb:
    <<: *php
    command: [php, artisan, 'reverb:start', '--host=0.0.0.0', '--port=8080']
    ports:
      - '127.0.0.1:${REVERB_PORT:-8081}:8080'
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'php -r ''exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);''']
      interval: 10s
      timeout: 5s
      retries: 5

  ai-api:
    image: library-stroll-ai:local
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file: docker/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_THINK: 'false'
      OLLAMA_NUM_PREDICT: 768
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${AI_API_PORT:-8002}:8001'
    depends_on:
      qdrant: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, 'import json,urllib.request; r=json.load(urllib.request.urlopen("http://127.0.0.1:8001/ready",timeout=35)); assert r["status"] == "ok", r']
      interval: 30s
      timeout: 40s
      retries: 10
      start_period: 120s
    init: true
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  app-storage:
