# Optional: all services in Docker, CPU inference. No public Ollama port needed.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
  ollama-models:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    env_file: docker/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [/bin/sh, -c]
    command:
      - 'set -eu; ollama pull "$$OLLAMA_CHAT_MODEL"; ollama pull "$$OLLAMA_VISION_MODEL"; ollama pull "$$OLLAMA_EMBEDDING_MODEL"'
    depends_on:
      ollama: {condition: service_healthy}
    restart: 'no'
  ai-api:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-models: {condition: service_completed_successfully}
volumes:
  ollama-models:
